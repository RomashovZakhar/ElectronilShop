{% extends "base.html" %}

{% block title %}Вход - Электроника{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">
                    <i class="fas fa-sign-in-alt text-primary"></i> Вход
                </h2>

                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Неверный логин или пароль. Попробуйте снова.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Логин</label>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}"
                               class="form-control" placeholder="Введите логин"
                               value="{{ form.username.value|default:'' }}" autofocus required>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}"
                               class="form-control" placeholder="Введите пароль" required>
                    </div>

                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                    </div>
                </form>

                <hr>
                <p class="text-center mb-0">
                    Ещё нет аккаунта?
                    <a href="{% url 'accounts:register' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
